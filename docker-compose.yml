services:
  profile-service:
      build: .
      container_name: profile-service
      restart: unless-stopped
      ports:
        - "8001:8000"
      environment:
        - DATABASE_URL=postgresql://profile_user:profile_pass@postgres-profile:5432/profile_db
        - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
        - REDPANDA_CONSUMER_GROUP=profile-service-group
        - KEYCLOAK_URL=${KEYCLOAK_URL}
        - KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
        - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
        - MEDIA_SERVICE_URL=http://media-service:8000
        - SERVICE_ID=profile-service
      depends_on:
        postgres-profile:
          condition: service_healthy
      extra_hosts:
        - "host.docker.internal:host-gateway"
      networks:
        - profile-network
        - auth-network
      env_file:
        - .env

  postgres-profile:
    image: postgres:15-alpine
    container_name: postgres-profile
    restart: unless-stopped
    environment:
      - POSTGRES_USER=profile_user
      - POSTGRES_PASSWORD=profile_pass
      - POSTGRES_DB=profile_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    networks:
      - profile-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  media-service:
    image: python:3.11-slim
    container_name: profile-media-service
    restart: unless-stopped
    working_dir: /app
    command: python -m http.server 8000
    ports:
      - "8002:8000"
    networks:
      - profile-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  profile-network:
    driver: bridge
  auth-network:
    external: true
    name: auth_service_auth-network

volumes:
  postgres_profile_data:
  redpanda_data:
